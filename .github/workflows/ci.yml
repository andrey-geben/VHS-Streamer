name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости для проверок
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML pytest ruff

      - name: Линтер
        run: ruff check .

      - name: Синтаксис
        run: python -m compileall -q *.py

      - name: Тесты
        run: pytest -q
