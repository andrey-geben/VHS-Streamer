# =====================================================================
#  VHS-Streamer — пример конфигурации
# =====================================================================
#  Скопируйте этот файл в config.yaml и заполните своими значениями:
#      copy config.example.yaml config.yaml
# =====================================================================

server:
  host: 0.0.0.0
  port: 8000
  # ОБЯЗАТЕЛЬНО поменяйте! Сгенерировать: python -c "import secrets; print(secrets.token_urlsafe(48))"
  secret_key: "CHANGE-ME-to-a-long-random-string"

network:
  interfaces:
    - name: eth0
      ip: 10.0.1.10
      description: "Сеть охраны труда"
    - name: eth1
      ip: 192.168.1.10
      description: "Сеть безопасности"
    - name: eth2
      ip: 172.16.0.10
      description: "Изолированная сеть"

mediamtx:
  binary: "./bin/mediamtx.exe"
  config: "./mediamtx.yml"
  rtsp_port: 8554
  webrtc_port: 8889           # поиск серверов
  api_url: "http://127.0.0.1:9997"
  loopback_codec: auto

security:
  auth_enabled: true
  users:
    - username: admin
      password: "CHANGE-ME"
      role: admin
    - username: viewer
      password: "CHANGE-ME"
      role: viewer
  api_token: "CHANGE-ME-api-token"
  session_lifetime_hours: 24

duplicate_stream:
  enabled: false
  port: 8080
  host: 0.0.0.0
  require_auth: true

archive:
  enabled: true
  path: "./archive"
  segment_minutes: 5
  max_size_gb: 50
  max_age_days: 30
  cleanup_interval_sec: 60
  codec: "mp4v"
  extension: ".mp4"
  record_all: true

cameras:
  - id: ip_1
    name: "IP камера — Вход"
    type: ip
    source: "rtsp://user:pass@192.168.1.100:554/stream1"
    fps: 25
    width: 1280
    height: 720
    record: true
    transport: "tcp"
    open_timeout_ms: 5000
    read_timeout_ms: 5000
    # --- Аудио ---
    has_audio: null      # заполняется автоматически при проверке
    audio: false         # захватывать звук (только если has_audio: true)

streams: []

# =====================================================================
#  ONVIF-прокси для NVR (Интеллект-икс и др.)
# =====================================================================
# Позволяет подключить VHS-Streamer как ONVIF-устройство.
# NVR видит наши камеры через этот прокси и не обращается к камерам напрямую.
onvif_proxy:
  # Включить прокси
  enabled: true

  # Порт, на котором слушает ONVIF-прокси.
  # Должен быть свободен (не 8000, не 8554, не 8889).
  port: 8081

  # Хост прослушивания. 0.0.0.0 — все интерфейсы.
  host: "0.0.0.0"

  # Какой адрес отдавать клиентам в RTSP-URL.
  # Если оставить пустым — используется адрес запроса.
  # Укажите здесь IP сервера, по которому клиент из нужной сети видит MediaMTX.
  # Пример: "192.168.1.103"
  public_host: ""

  # Информация об устройстве для GetDeviceInformation.
  manufacturer: "VHS-Streamer"
  model: "VHS-Streamer ONVIF Proxy"
  firmware: "1.1.0"
  serial: "VHS-PROXY-0001"
  hardware: "VHS-Proxy"