<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}VHS-Streamer{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4">
        <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e2126">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=4">
    <link rel="apple-touch-icon" href="/favicon.ico?v=4">
    <script>
        // Тема до отрисовки — чтобы не мигало белым/тёмным
        (function () {
            try {
                var t = localStorage.getItem('vhs-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (e) {}
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: Arial, sans-serif;
            background: #14161a; color: #e8e8e8;
        }
        header {
            background: #1e2126; padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #2a2f37;
        }
        header .brand { font-size: 1.3em; color: #4da3ff; font-weight: bold; }
        header nav a {
            color: #cfd6e0; text-decoration: none; margin-left: 18px;
            padding: 6px 10px; border-radius: 4px;
        }
        header nav a:hover { background: #2a2f37; }
        header .user { color: #8b96a5; font-size: 0.9em; }
        main { padding: 20px 24px; }
        .btn {
            background: #2a6df4; color: #fff; border: none; border-radius: 4px;
            padding: 8px 14px; cursor: pointer; text-decoration: none;
            display: inline-block; font-size: 0.95em;
        }
        .btn:hover { background: #1e5bd8; }
        .btn.secondary { background: #3a4150; }
        .btn.secondary:hover { background: #4a5260; }
        .btn.danger { background: #b13a3a; }
        .btn.danger:hover { background: #cf4545; }
        .card {
            background: #1e2126; border: 1px solid #2a2f37;
            border-radius: 8px; padding: 16px; margin-bottom: 16px;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
        .status-on { color: #57d87a; }
        .status-off { color: #f16a6a; }
        .muted { color: #8b96a5; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #2a2f37; }
        th { color: #8b96a5; font-weight: normal; font-size: 0.9em; }
        a.filelink { color: #6cb2ff; text-decoration: none; }
        a.filelink:hover { text-decoration: underline; }
        input, select {
            background: #14161a; border: 1px solid #2a2f37; border-radius: 4px;
            color: #e8e8e8; padding: 7px 9px; font-size: 0.95em;
        }
        input:focus, select:focus { outline: 1px solid #4da3ff; }
        label { color: #8b96a5; font-size: 0.9em; }
        .form-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .form-row label { min-width: 200px; }
        .form-row input[type=text], .form-row input[type=number] { flex: 1; }
        .toast {
            position: fixed; bottom: 20px; right: 20px;
            background: #2a6df4; color: #fff; padding: 12px 18px;
            border-radius: 6px; z-index: 200; box-shadow: 0 4px 12px rgba(0,0,0,.4);
            display: none;
        }
        .toast.err { background: #b13a3a; }
    </style>
    <link rel="stylesheet" href="/static/css/theme.css?v=7">
</head>
<body>
<header>
    <div class="brand">🎥 VHS-Streamer</div>
    <nav>
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Камеры</a>
        <a href="{{ url_for('archive_page') }}" class="{% if request.endpoint == 'archive_page' %}active{% endif %}">Архив</a>
        <a href="{{ url_for('events_page') }}" class="{% if request.endpoint == 'events_page' %}active{% endif %}">
        События
         <span id="menu-events-count"
          style="display:none;
                 background:#2a6df4; color:#fff;
                 border-radius:10px; padding:0 8px;
                 font-size:0.75em; margin-left:4px;
                 line-height:1.6em;"></span>
        </a>
        {% if user and user.role == 'admin' %}
        <a href="{{ url_for('settings.settings_page') }}" class="{% if request.endpoint == 'settings.settings_page' %}active{% endif %}">Настройки</a>
        <a href="{{ url_for('api_status') }}">API</a>
        {% endif %}
                {% if user %}
            <span class="user">{{ user.username }} ({{ user.role }})</span>
            <a href="{{ url_for('logout') }}">Выход</a>
        {% endif %}
        <button id="theme-toggle" class="theme-toggle" type="button"
                title="Переключить тему (тёмная / светлая)">🌙</button>
        <button id="pwa-install-btn" type="button"
                style="display:none; background:#2a6df4; color:#fff;
                       border:none; border-radius:4px; padding:6px 10px;
                       cursor:pointer; font-size:0.9em; margin-left:18px;"
                title="Установить VHS-Streamer как приложение">
            📲 Установить
        </button>
    </nav>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>

<div class="toast" id="global-toast"></div>
<script>
    // Простой тостик для уведомлений
    // Переключатель темы
    (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        function sync() {
            var cur = document.documentElement.getAttribute('data-theme') || 'dark';
            btn.textContent = cur === 'light' ? '☀️' : '🌙';
        }
        sync();
        btn.addEventListener('click', function () {
            var cur = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = cur === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('vhs-theme', next); } catch (e) {}
            sync();
        });
    })();

    function showToast(text, isError) {
        const el = document.getElementById('global-toast');
        el.textContent = text;
        el.className = 'toast' + (isError ? ' err' : '');
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
</script>
<footer style="
    margin-top: 40px;
    padding: 16px 24px;
    border-top: 1px solid #2a2f37;
    color: #8b96a5;
    font-size: 0.85em;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
">
    <span>{{ APP_FOOTER }}</span>
    <span>
        <a href="{{ url_for('about_page') }}"
           style="color:#6cb2ff; text-decoration:none">О программе</a>
    </span>
</footer>
<div class="toast" id="global-toast"></div>
<div class="toast" id="global-toast"></div>
<script>
    // Простой тостик для уведомлений
    function showToast(text, isError) {
        const el = document.getElementById('global-toast');
        el.textContent = text;
        el.className = 'toast' + (isError ? ' err' : '');
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    // Обновление счётчика событий в меню (раз в 60 секунд)
    async function updateEventsBadge() {
        const el = document.getElementById('menu-events-count');
        if (!el) return;
        try {
            const since = Math.floor(Date.now() / 1000) - 3600;
            const r = await fetch('/api/events?since_ts=' + since + '&limit=1000');
            if (!r.ok) { el.style.display = 'none'; return; }
            const data = await r.json();
            const count = (data.events || []).length;
            if (count > 0) {
                el.textContent = count;
                el.style.display = 'inline-block';
            } else {
                el.style.display = 'none';
            }
        } catch (e) {
            el.style.display = 'none';
        }
    }

    // Первый запуск через 1 сек, потом раз в минуту
    setTimeout(updateEventsBadge, 1000);
    setInterval(updateEventsBadge, 60000);
</script>
</body>
</body>
</body>
<script>
// PWA: регистрация service worker + кнопка «Установить»
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
            .then(function (reg) {
                console.log('PWA: SW ok, scope =', reg.scope);
            })
            .catch(function (err) {
                console.log('PWA: SW fail (нужен localhost/HTTPS):', err.message);
            });
    });
}

let _pwaPrompt = null;

window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    _pwaPrompt = e;
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'inline-block';
});

window.addEventListener('appinstalled', function () {
    _pwaPrompt = null;
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'none';
    if (typeof showToast === 'function') {
        showToast('VHS-Streamer установлен');
    }
});

document.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById('pwa-install-btn');
    if (!btn) return;
    btn.addEventListener('click', async function () {
        if (!_pwaPrompt) return;
        _pwaPrompt.prompt();
        const choice = await _pwaPrompt.userChoice;
        console.log('PWA: userChoice =', choice.outcome);
        _pwaPrompt = null;
        btn.style.display = 'none';
    });
});
</script>
</html>
