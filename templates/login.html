<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход — VHS-Streamer</title>
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#14161a; color:#e8e8e8;
               display:flex; align-items:center; justify-content:center; height:100vh; }
        .box { background:#1e2126; padding:32px 36px; border-radius:10px;
               border:1px solid #2a2f37; min-width:340px; }
        h1 { margin:0 0 20px; color:#4da3ff; font-size:1.4em; text-align:center; }
        label { display:block; margin-bottom:6px; color:#8b96a5; font-size:0.9em; }
        input { width:100%; padding:10px; background:#14161a; border:1px solid #2a2f37;
                border-radius:4px; color:#e8e8e8; margin-bottom:14px; font-size:1em; }
        button { width:100%; padding:11px; background:#2a6df4; color:#fff; border:none;
                 border-radius:4px; cursor:pointer; font-size:1em; }
        button:hover { background:#1e5bd8; }
        .err { color:#f16a6a; text-align:center; margin-bottom:12px; }
    </style>
</head>
<body>
<div class="box">
    <h1>VHS-Streamer</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post">
        <label>Логин</label>
        <input name="username" autofocus required>
        <label>Пароль</label>
        <input name="password" type="password" required>
        <button type="submit">Войти</button>
    </form>
</div>
</body>
</html>
